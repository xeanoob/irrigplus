<!doctype html>
<html lang="fr" class="antialiased">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="iRRIG+" />
  <meta name="theme-color" content="#0A0A0A" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <title>iRRIG+</title>
</head>

<body>
  <!-- Splash Screen — visible immédiatement au lancement PWA -->
  <div id="splash-screen" style="
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(160deg, #F9FAFB 0%, #EFF6FF 50%, #F0FDF4 100%);
    transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  ">
    <style>
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(1.06); opacity: 1; }
      }
      @keyframes splash-dot {
        0%, 80%, 100% { transform: scale(0.3); opacity: 0.3; }
        40% { transform: scale(1); opacity: 1; }
      }
      @keyframes splash-fade-in {
        from { opacity: 0; transform: translateY(14px); }
        to { opacity: 1; transform: translateY(0); }
      }
      #splash-screen.hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .splash-logo {
        width: 88px;
        height: 88px;
        animation: splash-pulse 3s ease-in-out infinite, splash-fade-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
        filter: drop-shadow(0 6px 16px rgba(14, 165, 233, 0.25));
      }
      .splash-brand {
        margin-top: 20px;
        font-family: 'Inter', system-ui, sans-serif;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #0EA5E9, #22C55E);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: splash-fade-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;
      }
      .splash-dots {
        display: flex;
        gap: 8px;
        margin-top: 32px;
        animation: splash-fade-in 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.3s both;
      }
      .splash-dots span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: linear-gradient(135deg, #0EA5E9, #22C55E);
        animation: splash-dot 1.8s ease-in-out infinite;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.24s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.48s; }
    </style>
    <img src="/logotransparent.png" alt="iRRIG+" class="splash-logo" />
    <div class="splash-brand">iRRIG+</div>
    <div class="splash-dots">
      <span></span><span></span><span></span>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
